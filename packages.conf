# ==============================================================================
# Sony Bravia (Android TV / Google TV) Package Configuration
# ==============================================================================
# Format: Arrays of package names or shell glob patterns (e.g. 'com.realtek.*')
# - PROTECTED_PACKAGES: Never disable or uninstall (Live TV/OTA, Cast, Core OS, SoC HALs)
# - SONY_BLOAT_PACKAGES: Sony demos, marketing, telemetry, help/eco bloat
# - TELEMETRY_AND_GOOGLE_BLOAT: SetupWraith, Katniss Voice, TalkBack, Samba TV, stubs
# - STOCK_LAUNCHER_PACKAGES: Disabled ONLY after Projectivy Launcher is verified active
# ==============================================================================

# 1. Protected Packages (Explicitly guarded across Realtek & MediaTek Bravia chassis)
