# 3. Telemetry, ACR Tracking, Heavy Background Daemons, & Preloaded Junk
TELEMETRY_AND_GOOGLE_BLOAT=(
    # SetupWraith (~74MB RAM background setup wizard leftover) & Partner Customizers
    "com.google.android.tungsten.setupwraith"
    "com.google.android.tvsetup.partnercustomizer"
    "com.google.android.onetimeinitializer"
    "com.google.android.partnersetup"

    # Google Assistant / Voice Search background interactor (~58MB RAM consumer)
    "com.google.android.katniss"

    # Android Accessibility Suite / TalkBack & Google Text-to-Speech (113MB RAM consumer)
    "com.google.android.marvin.talkback"
    "com.google.android.tts"

    # Unused NFC/SIM Secure Element daemon (30MB RAM consumer on TVs without NFC)
    "com.android.se"

    # Settings Intelligence background indexer (~56MB RAM consumer)
    "com.android.settings.intelligence"

    # Samba Interactive TV (ACR screen-watching telemetry & popups)
    "tv.samba.ssm"

    # Unused Google TV stubs, Duo/Tachyon video calling, Camera, & Play Games
    "com.google.android.apps.tachyon"
    "com.android.camera2"
    "com.google.android.play.games"
    "com.google.android.youtube.tvmusic"
    "com.google.android.videos"
    "com.google.android.music"

    # Preloaded demo games & defunct FandangoNow / legacy Vudu DownloaderTablet
    "eu.bandainamcoent.pacman256"
    "com.fandango.fandangonow.android.tv"
    "air.com.vudu.air.DownloaderTablet"

    # Telemetry, crash reporters, feedback, print spooler, calendar/contacts sync, screensavers
    "com.google.android.feedback"
    "com.android.printspooler"
    "com.android.bips"
    "com.android.dreams.basic"
    "com.android.DreamsBasic"
    "com.android.dreams.phototable"
    "com.google.android.backdrop"
    "com.android.wallpaper.livepicker"
    "com.android.wallpaperbackup"
    "com.android.providers.calendar"
    "com.google.android.syncadapters.calendar"
    "com.android.providers.contacts"
    "com.android.providers.userdictionary"
    "com.android.cts.ctsshim"
    "com.android.cts.priv.ctsshim"
)

